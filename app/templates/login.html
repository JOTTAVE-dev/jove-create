<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#795548">
    <title>Entrar - {{ app_name }}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/images/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/main.css">
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card">
        <a class="brand" href="/login" aria-label="{{ app_name }}">
          <img src="/static/images/icon.svg" alt="" width="44" height="44">
          <span>
            <strong>{{ app_name }}</strong>
            <small>JOVE CREATE</small>
          </span>
        </a>

        <div>
          <span class="eyebrow">Acesso seguro</span>
          <h1>Entrar</h1>
          <p>Informe suas credenciais para acessar o painel.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form class="form-stack" method="post" action="/login">
          <label>
            Login
            <input type="text" name="email" autocomplete="username" required>
          </label>
          <label>
            Senha
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <button class="button button-primary button-block" type="submit">Entrar</button>
        </form>
      </section>
    </main>
  </body>
</html>
