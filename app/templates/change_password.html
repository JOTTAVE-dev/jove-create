{% extends "base.html" %}

{% block content %}
<section class="page-header">
  <div>
    <span class="eyebrow">Segurança</span>
    <h1>Alterar senha</h1>
    <p>Atualize sua senha de acesso ao JOVE Manager.</p>
  </div>
</section>

<section class="content-grid">
  <article class="panel">
    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="alert alert-success" role="status">{{ success }}</div>
    {% endif %}

    <form class="form-stack" method="post" action="/settings/password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        Senha atual
        <input type="password" name="current_password" autocomplete="current-password" required>
      </label>
      <label>
        Nova senha
        <input type="password" name="new_password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>
        Confirmar nova senha
        <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
      </label>
      <button class="button button-primary button-block" type="submit">Alterar senha</button>
    </form>
  </article>
</section>
{% endblock %}
