<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#795548">
    <title>{{ app_name }}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/images/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/main.css">
  </head>
  <body>
    <aside class="sidebar" aria-label="Menu principal">
      <a class="brand" href="/" aria-label="{{ app_name }}">
        <img src="/static/images/icon.svg" alt="" width="40" height="40">
        <span>
          <strong>{{ app_name }}</strong>
          <small>JOVE CREATE</small>
        </span>
      </a>

      <nav class="nav-list">
        <a href="/" class="nav-link active" aria-label="Dashboard">
          <span class="nav-icon" aria-hidden="true">D</span>
          <span>Dashboard</span>
        </a>
        <a href="/sales" class="nav-link" aria-label="Vendas">
          <span class="nav-icon" aria-hidden="true">V</span>
          <span>Vendas</span>
        </a>
        <a href="/products" class="nav-link" aria-label="Produtos">
          <span class="nav-icon" aria-hidden="true">P</span>
          <span>Produtos</span>
        </a>
        <a href="/filament-purchases" class="nav-link" aria-label="Compras">
          <span class="nav-icon" aria-hidden="true">C</span>
          <span>Compras</span>
        </a>
        <a href="/expenses" class="nav-link" aria-label="Despesas">
          <span class="nav-icon" aria-hidden="true">E</span>
          <span>Despesas</span>
        </a>
        <a href="/equipments" class="nav-link" aria-label="Equipamentos">
          <span class="nav-icon" aria-hidden="true">I</span>
          <span>Investimentos</span>
        </a>
        <a href="/reports" class="nav-link" aria-label="Relatorios">
          <span class="nav-icon" aria-hidden="true">R</span>
          <span>Relatorios</span>
        </a>
        <a href="/#configuracoes" class="nav-link" aria-label="Configuracoes">
          <span class="nav-icon" aria-hidden="true">S</span>
          <span>Configuracoes</span>
        </a>
        <a href="/settings/password" class="nav-link" aria-label="Alterar senha">
          <span class="nav-icon" aria-hidden="true">K</span>
          <span>Senha</span>
        </a>
      </nav>

      <form method="post" action="/logout" class="logout-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="button button-secondary button-block" type="submit">Sair</button>
      </form>
    </aside>

    <main class="app-main">
      {% block content %}{% endblock %}
    </main>

    <a class="floating-action" href="/equipments/new" aria-label="Adicionar equipamento">+</a>

    <nav class="bottom-nav" aria-label="Menu inferior">
      <a href="/" class="active" aria-label="Dashboard"><span>D</span></a>
      <a href="/sales" aria-label="Vendas"><span>V</span></a>
      <a href="/products" aria-label="Produtos"><span>P</span></a>
      <a href="/filament-purchases" aria-label="Compras"><span>C</span></a>
      <a href="/expenses" aria-label="Despesas"><span>E</span></a>
    </nav>

    <script src="/static/js/app.js" defer></script>
  </body>
</html>
