[project]
name = "jove-manager"
version = "0.1.0"
description = "Web app financeiro e comercial da JOVE CREATE"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "Jinja2==3.1.5",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.3",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.fastapi.static]
cdn = false
